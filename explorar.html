<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar - TL Channels</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
    <a href="explorar.html" class="active"><i class="fas fa-compass"></i> Explorar</a>
    <a href="enviar.html"><i class="fas fa-plus-circle"></i> Sugerir</a>
  </nav>

  <!-- HEADER -->
  <header class="page-header">
    <h1>Directorio de Canales</h1>
    <p>Encuentra tu próxima comunidad en Telegram</p>
  </header>

  <!-- BUSCADOR -->
  <div class="search-container">
    <input
      type="text"
      id="searchInput"
      placeholder="Buscar por nombre o descripción…"
      aria-label="Buscar canales"
    >
  </div>

  <!-- FILTROS -->
  <div class="filter-container">
    
    <div class="filter-pill" data-filter="tecnologia">
      <i class="fas fa-laptop-code"></i> Tecnología
    </div>

    <div class="filter-pill" data-filter="cine">
      <i class="fas fa-film"></i> Cine
    </div>

    <div class="filter-pill" data-filter="finanzas">
      <i class="fas fa-chart-line"></i> Finanzas
    </div>

    <div class="filter-pill" data-filter="adultos">
      <i class="fas fa-triangle-exclamation"></i> +18
    </div>

    <div class="filter-pill" data-filter="otros">
      <i class="fas fa-layer-group"></i> Otros
    </div>
  </div>

  <!-- LISTADO DE CANALES (SE LLENA CON JS) -->
  <main class="container" id="channelList" aria-live="polite">
    <!-- Las cards se generan automáticamente -->
  </main>

  <!-- BOTÓN VOLVER ARRIBA -->
  <button id="scrollTopBtn" aria-label="Volver arriba">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2024 TL Channels</p>
  </footer>

  <!-- JS -->
  <script src="js/app.js"></script>
</body>
</html>
