<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canales aprobados - Directorio Telegram</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="top">
    <div class="brand">
      <div class="logo">📚</div>
      <div>
        <div class="title">Directorio Telegram</div>
        <a class="link" href="index.html">Inicio</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Canales aprobados</h1>
    <p class="muted">Busca por nombre, descripción o categoría.</p>

    <div class="filters">
      <input
        id="buscador"
        class="input"
        type="search"
        placeholder="Ej: estudio, memes, noticias, tec"
        autocomplete="off"
      />

      <select id="categoriaSelect" class="select">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <div class="row">
      <div class="counter">
        <b id="contador">Cargando...</b>
      </div>

      <a class="btn" href="enviar.html">Enviar canal</a>
    </div>

    <div id="vacio" class="empty" style="display:none;"></div>
    <section id="canales" class="grid"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
