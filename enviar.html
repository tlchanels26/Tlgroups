<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enviar Canal - TL Channels</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sugerir Nuevo Canal</h1>
        <nav><a href="explorar.html" style="color: white;">Volver a Explorar</a></nav>
    </header>

    <div class="form-container">
        <form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
            <label>Nombre del Canal:</label>
            <input type="text" name="nombre" required>

            <label>Enlace (@usuario o link):</label>
            <input type="text" name="link" required>

            <label>Categoría:</label>
            <select name="categoria">
                <option value="tecnologia">Tecnología</option>
                <option value="entretenimiento">Entretenimiento</option>
                <option value="educacion">Educación</option>
            </select>

            <label>Descripción:</label>
            <textarea name="descripcion" rows="4"></textarea>

            <button type="submit" class="btn-join" style="border:none; width:100%; cursor:pointer;">Enviar para Revisión</button>
        </form>
    </div>
</body>
</html>
