<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugerir Canal - TL Channels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="explorar.html"><i class="fas fa-compass"></i> Explorar</a>
        <a href="enviar.html" class="active"><i class="fas fa-plus-circle"></i> Sugerir</a>
        <a href="#"><i class="fas fa-envelope"></i> Contacto</a>
    </nav>

    <header>
        <h1>Añade tu Canal</h1>
        <p>Haz crecer tu audiencia compartiendo tu comunidad aquí.</p>
    </header>

    <div class="form-container">
        <form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
            
            <div class="form-group">
                <label>Nombre del Canal</label>
                <input type="text" name="name" placeholder="Ej: Noticias Tech" required>
            </div>

            <div class="form-group">
                <label>Enlace (Link)</label>
                <input type="url" name="link" placeholder="https://t.me/..." required>
            </div>

            <div class="form-group">
                <label>Categoría</label>
                <select name="category">
                    <option value="tecnologia">Tecnología 💻</option>
                    <option value="cine">Cine y Series 🎬</option>
                    <option value="educacion">Educación 📚</option>
                    <option value="negocios">Negocios 💼</option>
                    <option value="otros">Otros 🚀</option>
                </select>
            </div>

            <div class="form-group">
                <label>Descripción Breve</label>
                <textarea name="description" rows="4" placeholder="Describe tu canal en pocas palabras..."></textarea>
            </div>

            <button type="submit">
                <i class="fas fa-paper-plane"></i> Enviar Solicitud
            </button>
        </form>
    </div>

</body>
</html>
